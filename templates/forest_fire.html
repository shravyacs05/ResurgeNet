<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction</title>
    <!-- THE FIX: Use a direct path to the CSS file instead of url_for() -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12">
            
            <header class="text-center mb-8">
                <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800">
                    Forest Fire Prevention
                </h1>
                <p class="text-gray-500 mt-3 text-lg">
                    Enter environmental data to predict the probability of a wildfire.
                </p>
            </header>
            
            <form action="/predict" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label for="temperature" class="block text-sm font-medium text-gray-700 mb-1">Temperature (°C)</label>
                        <input type="number" step="any" name="temperature" id="temperature" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="e.g., 35.5">
                    </div>
                    <div>
                        <label for="oxygen" class="block text-sm font-medium text-gray-700 mb-1">Oxygen (%)</label>
                        <input type="number" step="any" name="oxygen" id="oxygen" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="e.g., 21">
                    </div>
                    <div>
                        <label for="humidity" class="block text-sm font-medium text-gray-700 mb-1">Humidity (%)</label>
                        <input type="number" step="any" name="humidity" id="humidity" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="e.g., 65">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg text-lg transition-all duration-300 shadow-lg hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-blue-300">
                        Predict Probability
                    </button>
                </div>
            </form>

            <!-- Prediction Result Section -->
            {% if pred %}
            <div class="mt-10 text-center p-6 rounded-lg {% if 'Danger' in pred %} bg-red-100 border border-red-300 {% else %} bg-green-100 border border-green-300 {% endif %}">
                <h2 class="text-2xl font-bold {% if 'Danger' in pred %} text-red-800 {% else %} text-green-800 {% endif %}">
                    {{ pred }}
                </h2>
                <p class="mt-2 text-md {% if 'Danger' in pred %} text-red-600 {% else %} text-green-600 {% endif %}">
                    {{ bhai }}
                </p>
            </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
